<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1><center>Rock-Paper-Scissor</center></h1>
    <div class="choices">
        <div class="choice" id="paper">
            <img src="paper.jpg"/>
        </div>
        <div class="choice" id="rock">
            <img src="rock.jpg"/>
        </div>
        <div class="choice" id="scissor">
            <img src="scissor.jpg"/>
        </div>
    </div>
    <div class="scoreboard">
        <div class="score">
            <p>Your score</p><br>
            <p id="Yourscore">0</p>
        </div><br><br>
        <div class="score">
            <p>Computer score</p><br>
            <p id="Computerscore">0</p>
        </div>
    </div>
    <div  class="msg"><center>Rock the Game</center></div>
    <script src="logic.js"></script>
</body>
</html>
